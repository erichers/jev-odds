services:
  jev-odds:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: ${DATABASE_PROVIDER:-Sqlite}
      ConnectionStrings__Odds: ${ODDS_CONNECTION:-Data Source=/data/jev-odds.db}
      Odds__CacheHours: "12"
      Odds__MonteCarloPaths: "20000"
      Odds__MonteCarloSeed: "184208"
    volumes:
      - odds-data:/data

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jev_odds}
      MYSQL_USER: ${MYSQL_USER:-jev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  odds-data:
  mysql-data:
